name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core - Node ${{ matrix.node }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Lint, typecheck, test, build, and install the published tarball
        run: npm run validate

  site:
    name: Site - lint, types, build, and content guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Validate the site
        run: npm run validate

  postgres:
    name: PostgreSQL ledger proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zerogate_ci
          POSTGRES_DB: zerogate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zerogate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ZEROGATE_TEST_ADMIN_DATABASE_URL: postgresql://postgres:zerogate_ci@127.0.0.1:5432/zerogate
      ZEROGATE_DATABASE_URL: postgresql://postgres:zerogate_ci@127.0.0.1:5432/zerogate
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Apply the checksum-locked migrations
        run: npm run db:migrate
      - name: Run the PostgreSQL integration proof
        run: npm run test:postgres

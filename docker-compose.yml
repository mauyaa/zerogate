services:
  postgres:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zerogate
      POSTGRES_DB: zerogate
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zerogate"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - zerogate_pg:/var/lib/postgresql

volumes:
  zerogate_pg:
